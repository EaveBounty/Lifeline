name: lifeline
description: "Lifeline · 履痕 — 个人资料管理软件（数据/配置外部挂载，AI 自动编译简历）。"
publish_to: 'none'

version: 0.6.0+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理 / 路由
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.2

  # 数据层
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  yaml: ^3.1.3
  yaml_edit: ^2.2.2
  yaml_writer: ^2.1.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  cryptography: ^2.9.0
  collection: ^1.19.0
  shared_preferences: ^2.3.0

  # 平台能力
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.1.0
  image_picker: ^1.1.2
  permission_handler: ^13.0.2
  path_provider: ^2.1.5
  path: ^1.9.0
  url_launcher: ^6.3.1
  window_manager: ^0.4.3
  watcher: ^1.1.0

  # 渲染 / 导出
  pdf: ^3.11.1
  printing: ^5.13.2
  open_filex: ^4.7.0
  share_plus: ^13.0.0
  package_info_plus: ^10.2.2
  flutter_markdown_plus: ^1.0.3

  # 网络 / AI
  dio: ^5.7.0

  # 工具
  intl: ^0.20.2
  logging: ^1.3.0
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
