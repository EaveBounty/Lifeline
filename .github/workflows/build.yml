name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.3"

permissions:
  contents: read

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 依赖
        run: flutter pub get
      - name: 可选拉取 Typst 二进制
        continue-on-error: true
        run: bash tool/fetch_typst.sh || true
      - name: 生成
        run: dart run build_runner build --delete-conflicting-outputs
      - name: 分析
        run: flutter analyze
      - name: 测试
        run: flutter test
      - name: 构建 APK
        run: flutter build apk --release --split-per-abi
      - name: 构建 AAB
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: lifeline-android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - name: 可选拉取 Typst 二进制
        continue-on-error: true
        run: bash tool/fetch_typst.sh || true
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - name: 打包便携版
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/lifeline-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: lifeline-linux
          path: lifeline-linux-x64.tar.gz
          if-no-files-found: warn

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 可选拉取 Typst 二进制
        continue-on-error: true
        shell: bash
        run: bash tool/fetch_typst.sh || true
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
      - name: 打包便携版
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath lifeline-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lifeline-windows
          path: lifeline-windows-x64.zip
          if-no-files-found: warn

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build web --release --no-web-resources-cdn
      - name: 打包 Web
        run: cd build/web && zip -r "$GITHUB_WORKSPACE/lifeline-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: lifeline-web
          path: lifeline-web.zip
          if-no-files-found: warn
