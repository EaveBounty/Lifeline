name: release

on:
  push:
    tags: ["v*"]

env:
  FLUTTER_VERSION: "3.44.3"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: rel-android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - name: 拉取 Typst 二进制
        continue-on-error: true
        run: bash tool/fetch_typst.sh || true
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/lifeline-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: rel-linux
          path: lifeline-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 拉取 Typst 二进制
        continue-on-error: true
        shell: bash
        run: bash tool/fetch_typst.sh || true
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath lifeline-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rel-windows
          path: lifeline-windows-x64.zip

  publish:
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
